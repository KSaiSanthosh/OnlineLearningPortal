{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>EduShare Login</title>

<style>

body{
font-family: Arial;
background: linear-gradient(120deg,#4c6ef5,#15aabf);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
}

.login-box{
background:white;
padding:40px;
border-radius:10px;
width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

.login-box h2{
margin-bottom:20px;
color:#333;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#4c6ef5;
border:none;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#3b5bdb;
}

.register-link{
margin-top:15px;
font-size:14px;
}

.register-link a{
color:#4c6ef5;
text-decoration:none;
font-weight:bold;
}

.register-link a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="login-box">

<h2>EduShare Login</h2>

<form method="post">
{% csrf_token %}

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div class="register-link">
<p>
Don't have an account?
<a href="/register/">Register</a>
</p>
</div>

</div>

</body>
</html>
