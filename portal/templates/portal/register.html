{% load static %}
<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link rel="stylesheet" href="{% static 'portal/style.css' %}">

<style>

/* CENTER FORM LIKE LOGIN PAGE */

.auth-container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.auth-box{
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
width:350px;
}

.auth-box h2{
text-align:center;
margin-bottom:20px;
color:#4c6ef5;
}

.auth-box input,
.auth-box select{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
}

.auth-btn{
width:100%;
background:#4c6ef5;
color:white;
border:none;
padding:10px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.auth-btn:hover{
background:#364fc7;
}

.auth-footer{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="auth-container">

<div class="auth-box">

<h2>Create Account</h2>

<form method="POST">

{% csrf_token %}

{{ form.username.label_tag }}
{{ form.username }}

{{ form.password.label_tag }}
{{ form.password }}

<label>Role</label>
{{ form.role }}

<button class="auth-btn" type="submit">Register</button>

</form>

<div class="auth-footer">

<p>
Already have an account?
<a href="/accounts/login/">Login</a>
</p>

</div>

</div>

</div>

</body>
</html>
